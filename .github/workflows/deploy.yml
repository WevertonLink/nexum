name: Deploy Nexum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Content audit
        run: npm run audit:content

      - name: Verify PWA essentials
        run: npm run verify:deploy

      - name: Build static site
        run: npm run build:pages

      - name: SPA fallback (404.html mirrors index.html)
        run: |
          if [ -f .output/public/index.html ] && [ ! -f .output/public/404.html ]; then
            cp .output/public/index.html .output/public/404.html
          fi

      - name: Ensure .nojekyll
        run: touch .output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
